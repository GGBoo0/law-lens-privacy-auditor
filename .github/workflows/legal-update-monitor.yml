name: Legal source monitor

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"
    - cron: "47 15 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: legal-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Prepare safe review baseline
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH_PREFIX: automation/legal-source-update
        run: |
          set -euo pipefail

          MATCHES="$(gh pr list --base main --state open --limit 100 \
            --json number,headRefName,headRepositoryOwner,isCrossRepository | \
            jq -c --arg owner "$GITHUB_REPOSITORY_OWNER" \
              '[.[] | select(
                .isCrossRepository == false and
                .headRepositoryOwner.login == $owner and
                (.headRefName | startswith("automation/legal-source-update"))
              )]')"
          MATCH_COUNT="$(jq 'length' <<<"$MATCHES")"
          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "열린 법령 자동화 PR이 둘 이상이므로 안전하게 중단합니다." >&2
            exit 1
          fi

          SNAPSHOT="$RUNNER_TEMP/legal-source-snapshot.json"
          REPORT="$RUNNER_TEMP/legal-monitor-report.md"
          if [ "$MATCH_COUNT" -eq 1 ]; then
            PR_NUMBER="$(jq -r '.[0].number' <<<"$MATCHES")"
            REVIEW_BRANCH="$(jq -r '.[0].headRefName' <<<"$MATCHES")"
            git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH:refs/remotes/origin/$REVIEW_BRANCH"
            git show "refs/remotes/origin/$REVIEW_BRANCH:data/legal-source-snapshot.json" > "$SNAPSHOT"
            EXISTING_PR=true
          else
            PR_NUMBER=""
            REVIEW_BRANCH="$REVIEW_BRANCH_PREFIX-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            cp data/legal-source-snapshot.json "$SNAPSHOT"
            EXISTING_PR=false
          fi

          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          echo "branch=$REVIEW_BRANCH" >> "$GITHUB_OUTPUT"
          echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check official legal sources from trusted code
        id: monitor
        env:
          LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
        run: >-
          node scripts/check-legal-updates.mjs
          --snapshot "${{ steps.review.outputs.snapshot }}"
          --report "${{ steps.review.outputs.report }}"

      - name: Publish machine-readable monitor status
        if: always()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          MONITOR_CHANGED: ${{ steps.monitor.outputs.changed }}
          CHECKED_AT: ${{ steps.monitor.outputs.checked_at }}
          SOURCE_COUNT: ${{ steps.monitor.outputs.source_count }}
          FAILED_SOURCE_COUNT: ${{ steps.monitor.outputs.failed_source_count }}
          STATUS_BRANCH: automation/legal-monitor-status
        run: |
          set -euo pipefail

          PREVIOUS_STATUS="$RUNNER_TEMP/legal-monitor-status.previous.json"
          PREVIOUS_MANIFEST="$RUNNER_TEMP/legal-runtime-manifest.previous.json"
          GENERATED_STATUS="$RUNNER_TEMP/legal-monitor-status.json"
          GENERATED_MANIFEST="$RUNNER_TEMP/legal-runtime-manifest.json"
          STATUS_WORKTREE="$RUNNER_TEMP/legal-monitor-status-worktree"
          LEGAL_SNAPSHOT="${{ steps.review.outputs.snapshot }}"

          if git fetch --no-tags origin "refs/heads/$STATUS_BRANCH:refs/remotes/origin/$STATUS_BRANCH"; then
            git show "refs/remotes/origin/$STATUS_BRANCH:data/legal-monitor-status.json" > "$PREVIOUS_STATUS"
            if ! git show "refs/remotes/origin/$STATUS_BRANCH:data/legal-runtime-manifest.json" > "$PREVIOUS_MANIFEST"; then
              cp data/legal-runtime-manifest.json "$PREVIOUS_MANIFEST"
            fi
            STATUS_BRANCH_EXISTS=true
          else
            cp data/legal-monitor-status.json "$PREVIOUS_STATUS"
            cp data/legal-runtime-manifest.json "$PREVIOUS_MANIFEST"
            STATUS_BRANCH_EXISTS=false
          fi

          if [ "$MONITOR_OUTCOME" = "success" ] && [ "$MONITOR_CHANGED" = "true" ]; then
            RESULT=changes_detected
          elif [ "$MONITOR_OUTCOME" = "success" ]; then
            RESULT=no_changes
          else
            RESULT=failed
          fi

          CHECKED_AT="${CHECKED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          SOURCE_COUNT="${SOURCE_COUNT:-$(jq '.sources | length' data/legal-sources.json)}"
          FAILED_SOURCE_COUNT="${FAILED_SOURCE_COUNT:-0}"
          node scripts/write-legal-monitor-status.mjs \
            --previous "$PREVIOUS_STATUS" \
            --output "$GENERATED_STATUS" \
            --result "$RESULT" \
            --checkedAt "$CHECKED_AT" \
            --sourceCount "$SOURCE_COUNT" \
            --failedSources "$FAILED_SOURCE_COUNT" \
            --workflowRunUrl "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --historyLimit 7 \
            --staleAfterHours 36

          if [ "$MONITOR_OUTCOME" = "success" ]; then
            node scripts/build-legal-runtime-manifest.mjs \
              --snapshot "$LEGAL_SNAPSHOT" \
              --registry data/legal-rule-review-registry.json \
              --previous "$PREVIOUS_MANIFEST" \
              --output "$GENERATED_MANIFEST" \
              --generatedAt "$CHECKED_AT" \
              --observedAt "$CHECKED_AT"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$STATUS_BRANCH_EXISTS" = "true" ]; then
            git worktree add -B "$STATUS_BRANCH" "$STATUS_WORKTREE" "refs/remotes/origin/$STATUS_BRANCH"
          else
            git worktree add -b "$STATUS_BRANCH" "$STATUS_WORKTREE" origin/main
          fi
          mkdir -p "$STATUS_WORKTREE/data"
          rm -f "$STATUS_WORKTREE/data/legal-monitor-status.json"
          cp "$GENERATED_STATUS" "$STATUS_WORKTREE/data/legal-monitor-status.json"
          if [ "$MONITOR_OUTCOME" = "success" ]; then
            rm -f "$STATUS_WORKTREE/data/legal-runtime-manifest.json"
            cp "$GENERATED_MANIFEST" "$STATUS_WORKTREE/data/legal-runtime-manifest.json"
          elif [ ! -f "$STATUS_WORKTREE/data/legal-runtime-manifest.json" ]; then
            cp data/legal-runtime-manifest.json "$STATUS_WORKTREE/data/legal-runtime-manifest.json"
          fi
          git -C "$STATUS_WORKTREE" add -- \
            data/legal-monitor-status.json \
            data/legal-runtime-manifest.json
          if git -C "$STATUS_WORKTREE" diff --cached --quiet; then
            echo "감시 상태에 기록할 변경이 없습니다."
          else
            git -C "$STATUS_WORKTREE" commit -m "Record legal source monitor status"
            git -C "$STATUS_WORKTREE" push origin "HEAD:refs/heads/$STATUS_BRANCH"
          fi

      - name: Notify or resolve legal monitor incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          MONITOR_CHANGED: ${{ steps.monitor.outputs.changed }}
          FAILED_SOURCE_COUNT: ${{ steps.monitor.outputs.failed_source_count }}
        run: |
          set -euo pipefail

          LABEL="automation:legal-monitor"
          TITLE="[automation] Legal source monitor failure"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh label create "$LABEL" \
            --color "B60205" \
            --description "Official legal source monitoring incident" \
            --force
          OPEN_ISSUE="$(gh issue list \
            --state open \
            --label "$LABEL" \
            --limit 100 \
            --json number,title \
            --jq "first(.[] | select(.title == \"$TITLE\")).number // empty")"

          if [ "$MONITOR_OUTCOME" != "success" ]; then
            printf -v BODY 'Official legal source monitoring failed.\n\n- Failed sources: %s\n- Workflow attempt: %s\n- Run: %s\n\nOfficial-source requests were retried with bounded backoff. Review immediately if consecutive failures continue.' \
              "${FAILED_SOURCE_COUNT:-unknown}" "$GITHUB_RUN_ATTEMPT" "$RUN_URL"
            if [ -n "$OPEN_ISSUE" ]; then
              gh issue comment "$OPEN_ISSUE" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
            fi
          elif [ -n "$OPEN_ISSUE" ]; then
            if [ "$MONITOR_CHANGED" = "true" ]; then
              RESULT_TEXT="recovered and detected legal-source changes"
            else
              RESULT_TEXT="recovered with no legal-source changes"
            fi
            gh issue close "$OPEN_ISSUE" \
              --comment "Monitor ${RESULT_TEXT}. Recovery run: ${RUN_URL}"
          fi

      - name: Validate trusted application before publishing a review
        if: steps.monitor.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run lint

      - name: Revalidate the review destination
        if: steps.monitor.outputs.changed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_BRANCH: ${{ steps.review.outputs.branch }}
          INITIAL_EXISTING_PR: ${{ steps.review.outputs.existing_pr }}
          INITIAL_PR_NUMBER: ${{ steps.review.outputs.pr_number }}
          REVIEW_BRANCH_PREFIX: automation/legal-source-update
        run: |
          set -euo pipefail

          REVIEW_BRANCH="$INITIAL_BRANCH"
          EXISTING_PR="$INITIAL_EXISTING_PR"
          PR_NUMBER="$INITIAL_PR_NUMBER"
          if [ "$EXISTING_PR" = "true" ]; then
            CURRENT_PR="$(gh pr view "$PR_NUMBER" \
              --json state,headRefName,headRepositoryOwner,isCrossRepository 2>/dev/null || echo '{}')"
            if ! jq -e \
              --arg branch "$REVIEW_BRANCH" \
              --arg owner "$GITHUB_REPOSITORY_OWNER" \
              '.state == "OPEN" and
               .headRefName == $branch and
               .isCrossRepository == false and
               .headRepositoryOwner.login == $owner' \
              >/dev/null <<<"$CURRENT_PR"; then
              REVIEW_BRANCH="$REVIEW_BRANCH_PREFIX-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-late"
              EXISTING_PR=false
              PR_NUMBER=""
            fi
          fi

          echo "branch=$REVIEW_BRANCH" >> "$GITHUB_OUTPUT"
          echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Append bot commit without rewriting review history
        if: steps.monitor.outputs.changed == 'true'
        env:
          REVIEW_BRANCH: ${{ steps.publish.outputs.branch }}
          EXISTING_PR: ${{ steps.publish.outputs.existing_pr }}
          GENERATED_SNAPSHOT: ${{ steps.review.outputs.snapshot }}
          GENERATED_REPORT: ${{ steps.review.outputs.report }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/sync-legal-review-branch.mjs \
            --branch "$REVIEW_BRANCH" \
            --existing "$EXISTING_PR" \
            --snapshot "$GENERATED_SNAPSHOT" \
            --report "$GENERATED_REPORT"

      - name: Create review PR or add a new report comment
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ steps.publish.outputs.branch }}
          EXISTING_PR: ${{ steps.publish.outputs.existing_pr }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          GENERATED_REPORT: ${{ steps.review.outputs.report }}
        run: |
          set -euo pipefail

          CAN_COMMENT=false
          if [ "$EXISTING_PR" = "true" ]; then
            CURRENT_STATE="$(gh pr view "$PR_NUMBER" --json state,headRefName \
              --jq '[.state, .headRefName] | @tsv' 2>/dev/null || true)"
            if [ "$CURRENT_STATE" = $'OPEN\t'"$REVIEW_BRANCH" ]; then
              CAN_COMMENT=true
            fi
          fi

          if [ "$CAN_COMMENT" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$GENERATED_REPORT"
          else
            git fetch --no-tags origin main
            if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
              echo "새 법령 스냅샷 커밋이 이미 main에 포함되어 추가 PR이 필요하지 않습니다."
              exit 0
            fi
            gh pr create \
              --draft \
              --base main \
              --head "$REVIEW_BRANCH" \
              --title "공식 법령·지침 변경 검토 필요" \
              --body-file "$GENERATED_REPORT"
          fi

      - name: Notify or resolve legal automation pipeline incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: |
          set -euo pipefail

          # Official-source failures are handled by the dedicated incident step.
          # This issue covers status publication, validation, branch sync and PR failures.
          if [ "$MONITOR_OUTCOME" != "success" ]; then
            exit 0
          fi

          LABEL="automation:legal-pipeline"
          TITLE="[automation] Legal update pipeline failure"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh label create "$LABEL" \
            --color "B60205" \
            --description "Legal status publication or review pipeline incident" \
            --force
          OPEN_ISSUE="$(gh issue list \
            --state open \
            --label "$LABEL" \
            --limit 100 \
            --json number,title \
            --jq "first(.[] | select(.title == \"$TITLE\")).number // empty")"

          if [ "$JOB_STATUS" != "success" ]; then
            BODY="A post-monitor legal automation step failed. The live manifest or review PR may be stale. Run: $RUN_URL"
            if [ -n "$OPEN_ISSUE" ]; then
              gh issue comment "$OPEN_ISSUE" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
            fi
          elif [ -n "$OPEN_ISSUE" ]; then
            gh issue close "$OPEN_ISSUE" \
              --comment "The legal update pipeline recovered. Recovery run: $RUN_URL"
          fi
